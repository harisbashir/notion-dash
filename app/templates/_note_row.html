<article class="row" data-search="{{ note.title }} {{ note.type or '' }} {{ project_name(note.project_ids, projects) }}">
<a class="row-title" href="/notes/{{ note.source }}/{{ note.id }}">{{ note.title }}</a>
<div class="meta">{% if note.type %}<span>{{ note.type }}</span>{% endif %}{% if not project_page and note.project_ids %}<span>{{ project_name(note.project_ids, projects) }}</span>{% endif %}</div>
</article>
