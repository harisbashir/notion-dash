{% macro select(name, label, options, value, empty=true) %}
<label>{{ label }}<select name="{{ name }}">
{% if empty %}<option value="" {% if not value %}selected{% endif %}>None</option>{% endif %}
{% if value and value not in options %}<option value="{{ value }}" selected>{{ value }}</option>{% endif %}
{% for option in options %}<option value="{{ option }}" {% if option == value %}selected{% endif %}>{{ option }}</option>{% endfor %}
</select></label>
{% endmacro %}
{% macro project_select(projects, ids=[]) %}
<label>Project<select name="project"><option value="">No project</option>
{% if ids and ids[0] not in projects %}<option value="{{ ids[0] }}" selected>Unknown project</option>{% endif %}
{% for p in projects.values() %}<option value="{{ p.id }}" {% if ids and p.id == ids[0] %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
</select></label>
{% endmacro %}
{% macro search(target) %}<label class="list">Filter by text<input type="search" data-filter="{{ target }}" placeholder="Search this list"></label>{% endmacro %}
