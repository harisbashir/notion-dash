{% from '_forms.html' import select %}
<form id="project-fields" class="editor {% if saved %}saved{% endif %}" hx-post="/projects/{{ project.id }}" hx-target="this" hx-swap="outerHTML">
{{ select('status', 'Status', status_options, project.status, false) }}
{{ select('priority', 'Priority', priority_options, project.priority) }}
<label>Summary<textarea name="summary">{{ project.summary }}</textarea></label>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<button>{{ 'Try again' if error else 'Save' }}</button>
</form>
