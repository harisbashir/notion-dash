<div id="note-body">
{% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
<div class="note-body">{{ body }}</div>
<form {% if error %}data-dirty="true"{% endif %} class="append" hx-post="/notes/{{ note.id }}/append" hx-target="#note-body" hx-swap="outerHTML">
<input type="hidden" name="_body" value="{{ body_blocks|default([])|tojson|forceescape }}">
<label><span class="visually-hidden">Append text</span><textarea name="text" rows="3" placeholder="Add to this note" required>{{ append_text or '' }}</textarea></label>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<div class="actions"><button class="primary">{{ 'Try again' if error else 'Append text' }}</button></div>
</form>
</div>
