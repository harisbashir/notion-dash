{% from '_forms.html' import project_select %}
<form {% if error %}data-dirty="true"{% endif %} id="idea-new" class="quick-add" hx-post="/ideas" hx-target="#idea-list-new" hx-swap="afterbegin" hx-on::after-request="if(event.detail.successful && this.isConnected){this.reset();this.removeAttribute('data-dirty')}">
<div class="fields">
<label class="stacked"><span class="visually-hidden">Idea</span><input name="title" placeholder="What's the idea?" value="{{ title or '' }}" required autocomplete="off"></label>
<label class="stacked"><span class="visually-hidden">Details</span><textarea name="details" rows="2" placeholder="Details">{{ details or '' }}</textarea></label>
{{ project_select(projects, [project] if project else []) }}
</div>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<div class="actions"><button class="primary">{{ 'Try again' if error else 'Add idea' }}</button></div>
</form>
